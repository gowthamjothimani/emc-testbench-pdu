<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-inset: #090c10;
            --card-bg: #161b22;
            --card-bg-alt: #1c2128;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --success: #2ea043;
            --accent-blue: #58a6ff;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .header-logo-section {
            background-color: var(--card-bg-alt);
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent-blue);
        }

        .logo-placeholder {
            max-width: 90px;
            height: auto;
            margin-bottom: 12px;
            background: #ffffff;
            padding: 6px;
            border-radius: 4px;
        }

        .app-name {
            font-family: var(--font-mono);
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.05rem;
            margin: 0 0 4px;
            text-align: center;
        }

        .app-sub {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            text-transform: uppercase;
            margin: 0;
        }

        .form-content {
            padding: 28px 36px 34px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: var(--bg-inset);
            color: var(--text-main);
            font-family: var(--font-mono);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: var(--success);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 6px;
            transition: filter 0.15s;
        }

        button:hover {
            filter: brightness(1.12);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-logo-section">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="EMC LOGO" class="logo-placeholder">
            <h2 class="app-name">EMC PDU Test Bench</h2>
            <p class="app-sub">Operator Login</p>
        </div>

        <div class="form-content">
            <form method="POST" action="/submittestinfo">
                <div class="input-group">
                    <label for="testername">Tester ID</label>
                    <input list="tester-names" type="text" id="testername" name="testername" required placeholder="Select operator">
                    <datalist id="tester-names">
                        <option value="Gowtham">
                        <option value="Suraj">
                        <option value="Nithyanandham">
                        <option value="Sebastiaan">
                        <option value="Michal">
                        <option value="Rolf">
                        <option value="Hari">
                    </datalist>
                </div>

                <div class="input-group">
                    <label for="modelnumber">Hardware Model</label>
                    <input list="model-numbers" type="text" id="modelnumber" name="modelnumber" required placeholder="Select model number">
                    <datalist id="model-numbers">
                        <option value="PDU-G1.0.0">
                        <option value="PDU-G1.0.1">
                        <option value="PDU-G1.1.0">
                        <option value="PDU-G1.2.0">
                    </datalist>
                </div>

                <div class="input-group">
                    <label for="projectdetail">Project ID</label>
                    <input list="project-details" type="text" id="projectdetail" name="projectdetail" required placeholder="Select project">
                    <datalist id="project-details">
                        <option value="HS25001">
                        <option value="Test-DTAPIN">
                        <option value="Test-Project">
                        <option value="Project01">
                    </datalist>
                </div>

                <div class="input-group">
                    <label for="serialnumber">PCB Serial Number</label>
                    <input type="text" id="serialnumber" name="serialnumber" required placeholder="Scan or type Serial No.">
                </div>

                <button type="submit">Initialize Test</button>
            </form>
        </div>
    </div>

</body>
</html>
